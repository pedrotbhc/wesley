<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar - Frigorífico Flor do Campo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #faf6f0; color: #333; line-height: 1.5; padding-top: 100px; }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }
    .conteudo { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

    .cabecalho { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: #8b1e1e; color: #fff; }
    .cabecalho-interno { max-width: 1100px; margin: 0 auto; padding: 14px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
    .logo { font-size: 22px; font-weight: bold; }
    .busca { display: flex; flex: 1; min-width: 220px; gap: 6px; }
    .busca input { flex: 1; padding: 8px 12px; border: none; border-radius: 6px; font-size: 15px; }
    .busca button { padding: 8px 16px; border: none; border-radius: 6px; background: #f2b632; font-weight: bold; cursor: pointer; }
    .menu { display: flex; gap: 16px; }
    .menu a:hover { text-decoration: underline; }

    .rodape { background: #333; color: #ddd; text-align: center; padding: 24px 20px; margin-top: 50px; font-size: 14px; }

    .botao { display: block; width: 100%; padding: 11px 20px; background: #8b1e1e; color: #fff; border: none; border-radius: 6px; font-size: 16px; text-align: center; cursor: pointer; }
    .botao:hover { background: #6a1515; }
    .botao-contorno { background: #fff; color: #8b1e1e; border: 1px solid #8b1e1e; }
    .botao-contorno:hover { background: #8b1e1e; color: #fff; }

    .caixa { max-width: 400px; margin: 30px auto 0; background: #fff; border: 1px solid #e5dccf; border-radius: 10px; padding: 28px; }
    .caixa h1 { color: #8b1e1e; font-size: 26px; text-align: center; }
    .subtitulo { color: #777; text-align: center; margin-bottom: 20px; }
    label { display: block; margin: 12px 0 4px; font-size: 14px; }
    .campo { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    .campo:focus { outline: none; border-color: #8b1e1e; }
    .opcoes { display: flex; justify-content: space-between; margin: 14px 0 18px; font-size: 14px; }
    .opcoes a, .rodape-caixa a { color: #8b1e1e; font-weight: bold; }
    .ou { text-align: center; color: #999; margin: 14px 0; font-size: 14px; }
    .rodape-caixa { text-align: center; margin-top: 20px; font-size: 14px; }

    @media (max-width: 800px) { body { padding-top: 160px; } }
  </style>
</head>
<body>

  <header class="cabecalho">
    <div class="cabecalho-interno">
      <a class="logo" href="index.html">🥩 Frigorífico Flor do Campo</a>
      <form class="busca" action="produtos.html" method="get" role="search">
        <input type="search" name="busca" placeholder="Buscar produtos...">
        <button type="submit">Buscar</button>
      </form>
      <ul class="menu">
        <li><a href="produtos.html">Produtos</a></li>
        <li><a href="contato.html">Contato</a></li>
        <li><a href="login.html">Entrar</a></li>
        <li><a href="carrinho.html">🛒 Carrinho (3)</a></li>
      </ul>
    </div>
  </header>

  <main class="conteudo">
    <section class="caixa">
      <h1>Entrar na sua conta</h1>
      <p class="subtitulo">Acesse para acompanhar seus pedidos</p>

      <form action="conta.html" method="get">
        <label for="email">E-mail</label>
        <input type="email" class="campo" id="email" placeholder="voce@email.com" required>

        <label for="senha">Senha</label>
        <input type="password" class="campo" id="senha" placeholder="Sua senha" required>

        <div class="opcoes">
          <label><input type="checkbox" id="lembrar"> Lembrar de mim</label>
          <a href="login.html">Esqueci a senha</a>
        </div>

        <button type="submit" class="botao">Entrar</button>
      </form>

      <p class="ou">ou</p>
      <a href="index.html" class="botao botao-contorno">Continuar como visitante</a>

      <p class="rodape-caixa">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </section>
  </main>

  <footer class="rodape">
    <p>&copy; 2026 Frigorífico Flor do Campo · Seg a Sáb, 8h às 18h · (00) 0000-0000</p>
  </footer>

</body>
</html>
